  default_prompt: "$dev-log-rich-post-workspace-v2를 사용해 원고를 먼저 검증·고정하고, Tistory 이미지는 제가 비공개 업로드 후 CDN URL을 전달하는 경계로 두고, 한 번의 독립 최종 페이지 QA로 글을 완성해 주세요."

policy:
  allow_implicit_invocation: false
