interface:
  display_name: "dev.log Rich Post Workspace"
  short_description: "독자 친화적 설명과 반응형 HTML을 검증하는 Tistory 워크플로"
  default_prompt: "$dev-log-rich-post-workspace를 사용해 낯선 독자도 이해할 수 있는 설명, 명확한 비교표와 사용법, 검증된 반응형 HTML을 갖춘 Tistory 글을 origin/master까지 완성해 주세요."

policy:
  allow_implicit_invocation: true
