<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orca worktree 흐름 인포그래픽</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 1080px;
      height: 1350px;
      margin: 0;
      overflow: hidden;
    }

    body {
      color: #172033;
      font-family: "Apple SD Gothic Neo", "AppleGothic", sans-serif;
      background: #f4f1ea;
    }

    svg {
      display: block;
      width: 1080px;
      height: 1350px;
    }

    .eyebrow {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 0.14em;
    }

    .headline {
      font-size: 60px;
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    .subtitle {
      fill: #596173;
      font-size: 29px;
      font-weight: 650;
      letter-spacing: -0.025em;
    }

    .stage {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .node-title {
      font-size: 39px;
      font-weight: 800;
      letter-spacing: -0.035em;
    }

    .lane-title {
      font-size: 31px;
      font-weight: 800;
      letter-spacing: 0.035em;
    }

    .label {
      fill: #30384a;
      font-size: 30px;
      font-weight: 730;
      letter-spacing: -0.025em;
    }

    .small {
      fill: #626b7c;
      font-size: 24px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .review-title {
      font-size: 43px;
      font-weight: 800;
      letter-spacing: -0.045em;
    }

    .result-title {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .caveat-title {
      font-size: 26px;
      font-weight: 800;
    }

    .caveat {
      fill: #4c5261;
      font-size: 27px;
      font-weight: 650;
      letter-spacing: -0.025em;
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 1080 1350" role="img"
       aria-labelledby="infographic-title infographic-desc">
    <title id="infographic-title">Orca 병렬 worktree 흐름</title>
    <desc id="infographic-desc">
      기준 저장소에서 두 worktree를 만들고, 각 에이전트가 같은 성공 조건으로
      작업한 뒤 diff를 검토해 채택할 변경만 반영하는 과정
    </desc>

    <defs>
      <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fbfaf6"/>
        <stop offset="100%" stop-color="#eee9df"/>
      </linearGradient>
      <linearGradient id="review" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
        <stop offset="100%" stop-color="#eaf2f3" stop-opacity="0.9"/>
      </linearGradient>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="10" stdDeviation="12"
                      flood-color="#384152" flood-opacity="0.12"/>
      </filter>
      <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="5" stdDeviation="7"
                      flood-color="#384152" flood-opacity="0.1"/>
      </filter>
      <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="4" r="0.8" fill="#6d7480" opacity="0.08"/>
        <circle cx="17" cy="13" r="0.7" fill="#6d7480" opacity="0.06"/>
        <path d="M7 20h5" stroke="#6d7480" stroke-width="0.7" opacity="0.05"/>
      </pattern>
      <marker id="arrow-blue" markerWidth="10" markerHeight="10"
              refX="8" refY="5" orient="auto">
        <path d="M0 0L10 5L0 10Z" fill="#38748f"/>
      </marker>
      <marker id="arrow-amber" markerWidth="10" markerHeight="10"
              refX="8" refY="5" orient="auto">
        <path d="M0 0L10 5L0 10Z" fill="#b06b32"/>
      </marker>
      <marker id="arrow-dark" markerWidth="10" markerHeight="10"
              refX="8" refY="5" orient="auto">
        <path d="M0 0L10 5L0 10Z" fill="#172033"/>
      </marker>
    </defs>

    <rect width="1080" height="1350" fill="#f4f1ea"/>
    <rect width="1080" height="1350" fill="url(#grain)"/>
    <circle cx="1010" cy="80" r="260" fill="#dce9ec" opacity="0.52"/>
    <circle cx="60" cy="630" r="260" fill="#f2dfcf" opacity="0.38"/>

    <!-- Header -->
    <g transform="translate(72 62)">
      <rect width="430" height="48" rx="24" fill="#172033"/>
      <path d="M29 30c8-17 24-20 37-12-10 2-14 9-17 20-5-5-12-7-20-8Z"
            fill="#f6f2e9"/>
      <ellipse cx="48" cy="23" rx="4" ry="2.5" fill="#172033"/>
      <text x="79" y="32" class="eyebrow" fill="#ffffff">
        ORCA · WORKTREE FLOW
      </text>
    </g>

    <text x="72" y="164" class="headline" fill="#172033">
      <tspan x="72">같은 기준에서 나누고,</tspan>
      <tspan x="72" dy="72">diff로 비교한 뒤 하나만 반영합니다</tspan>
    </text>
    <text x="74" y="286" class="subtitle">
      Orca의 핵심은 에이전트 수보다 분리된 작업공간과 검토 흐름입니다.
    </text>

    <!-- Source -->
    <g filter="url(#shadow)">
      <rect x="350" y="330" width="380" height="128" rx="28"
            fill="url(#paper)" stroke="#c8c2b8" stroke-width="2"/>
      <rect x="382" y="357" width="69" height="73" rx="12"
            fill="#ffffff" stroke="#9da5b1" stroke-width="2"/>
      <path d="M398 373h37M398 387h37M398 401h25"
            stroke="#596173" stroke-width="5" stroke-linecap="round"/>
      <circle cx="440" cy="414" r="7" fill="#172033"/>
      <text x="482" y="372" class="stage" fill="#7b8494">1 · 기준</text>
      <text x="482" y="413" class="node-title" fill="#172033">기준 저장소</text>
      <text x="482" y="442" class="small">origin/main</text>
    </g>

    <!-- Branch splitter -->
    <path d="M540 458V494" stroke="#172033" stroke-width="7"
          stroke-linecap="round"/>
    <circle cx="540" cy="501" r="12" fill="#172033"/>
    <path d="M540 501C448 501 314 508 276 563"
          fill="none" stroke="#38748f" stroke-width="8"
          stroke-linecap="round"/>
    <path d="M540 501C632 501 766 508 804 563"
          fill="none" stroke="#b06b32" stroke-width="8"
          stroke-linecap="round"/>

    <rect x="482" y="505" width="116" height="35" rx="17"
          fill="#f4f1ea"/>
    <text x="540" y="531" class="stage" fill="#7b8494"
          text-anchor="middle">2 · 분리</text>

    <!-- Left worktree track -->
    <g>
      <path d="M276 563C225 582 193 606 184 638C174 672 171 713 189 778C205 806 250 812 303 810"
            fill="none" stroke="#d5e5eb" stroke-width="74"
            stroke-linecap="round"/>
      <path d="M276 563C225 582 193 606 184 638C174 672 171 713 189 778C205 806 250 812 303 810"
            fill="none" stroke="#38748f" stroke-width="7"
            stroke-linecap="round" marker-end="url(#arrow-blue)"/>

      <rect x="94" y="547" width="322" height="65" rx="32"
            fill="#dcebf0" stroke="#8bb0c0" stroke-width="2"/>
      <text x="255" y="590" class="lane-title" fill="#245b75"
            text-anchor="middle">WORKTREE A</text>

      <g transform="translate(184 638)" filter="url(#soft-shadow)">
        <circle r="31" fill="#ffffff" stroke="#8bb0c0" stroke-width="3"/>
        <path d="M-15-7h12l7 7h14v18h-33Z"
              fill="none" stroke="#245b75" stroke-width="4"
              stroke-linejoin="round"/>
      </g>
      <text x="235" y="649" class="label">별도 폴더 · 별도 브랜치</text>

      <g transform="translate(173 708)" filter="url(#soft-shadow)">
        <circle r="31" fill="#ffffff" stroke="#8bb0c0" stroke-width="3"/>
        <path d="M-14-10l9 9-9 9M0 12h16"
              fill="none" stroke="#245b75" stroke-width="4"
              stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="224" y="719" class="label">에이전트 A</text>

      <g transform="translate(189 778)" filter="url(#soft-shadow)">
        <circle r="31" fill="#ffffff" stroke="#8bb0c0" stroke-width="3"/>
        <path d="M-14 0l9 9 19-22"
              fill="none" stroke="#245b75" stroke-width="5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="240" y="770" class="label">같은 성공 조건</text>
      <text x="240" y="801" class="small">테스트 · lint</text>
    </g>

    <!-- Right worktree track -->
    <g>
      <path d="M804 563C855 582 887 606 896 638C906 672 909 713 891 778C875 806 830 812 777 810"
            fill="none" stroke="#f0dfcf" stroke-width="74"
            stroke-linecap="round"/>
      <path d="M804 563C855 582 887 606 896 638C906 672 909 713 891 778C875 806 830 812 777 810"
            fill="none" stroke="#b06b32" stroke-width="7"
            stroke-linecap="round" marker-end="url(#arrow-amber)"/>

      <rect x="664" y="547" width="322" height="65" rx="32"
            fill="#f3e5d7" stroke="#d2a47e" stroke-width="2"/>
      <text x="825" y="590" class="lane-title" fill="#8a4d22"
            text-anchor="middle">WORKTREE B</text>

      <g transform="translate(896 638)" filter="url(#soft-shadow)">
        <circle r="31" fill="#ffffff" stroke="#d2a47e" stroke-width="3"/>
        <path d="M-15-7h12l7 7h14v18h-33Z"
              fill="none" stroke="#8a4d22" stroke-width="4"
              stroke-linejoin="round"/>
      </g>
      <text x="845" y="649" class="label"
            text-anchor="end">별도 폴더 · 별도 브랜치</text>

      <g transform="translate(907 708)" filter="url(#soft-shadow)">
        <circle r="31" fill="#ffffff" stroke="#d2a47e" stroke-width="3"/>
        <path d="M-14-10l9 9-9 9M0 12h16"
              fill="none" stroke="#8a4d22" stroke-width="4"
              stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="856" y="719" class="label"
            text-anchor="end">에이전트 B</text>

      <g transform="translate(891 778)" filter="url(#soft-shadow)">
        <circle r="31" fill="#ffffff" stroke="#d2a47e" stroke-width="3"/>
        <path d="M-14 0l9 9 19-22"
              fill="none" stroke="#8a4d22" stroke-width="5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="840" y="770" class="label"
            text-anchor="end">같은 성공 조건</text>
      <text x="840" y="801" class="small"
            text-anchor="end">테스트 · lint</text>
    </g>

    <!-- Review convergence -->
    <path d="M303 810C341 855 408 871 443 881"
          fill="none" stroke="#38748f" stroke-width="8"
          stroke-linecap="round"/>
    <path d="M777 810C739 855 672 871 637 881"
          fill="none" stroke="#b06b32" stroke-width="8"
          stroke-linecap="round"/>

    <g filter="url(#shadow)">
      <circle cx="540" cy="893" r="119" fill="url(#review)"
              stroke="#8895a4" stroke-width="5"/>
      <rect x="476" y="833" width="78" height="104" rx="10"
            fill="#dcebf0" stroke="#38748f" stroke-width="3"
            transform="rotate(-6 515 885)"/>
      <path d="M492 855h43M492 874h34M492 893h47M492 912h28"
            stroke="#38748f" stroke-width="5" stroke-linecap="round"/>
      <rect x="526" y="833" width="78" height="104" rx="10"
            fill="#f3e5d7" stroke="#b06b32" stroke-width="3"
            transform="rotate(6 565 885)"/>
      <path d="M544 855h43M544 874h27M544 893h46M544 912h34"
            stroke="#b06b32" stroke-width="5" stroke-linecap="round"/>
      <circle cx="618" cy="952" r="25" fill="#172033"/>
      <path d="M634 969l24 25"
            stroke="#172033" stroke-width="12" stroke-linecap="round"/>
    </g>

    <text x="540" y="1037" class="stage" fill="#7b8494"
          text-anchor="middle">3 · 검토</text>
    <text x="540" y="1083" class="review-title" fill="#172033"
          text-anchor="middle">diff로 결과 비교</text>
    <text x="540" y="1123" class="small" text-anchor="middle">
      테스트 결과 · 변경 범위 · 유지보수성
    </text>

    <!-- Selection and cleanup -->
    <path d="M540 1139v40" stroke="#172033" stroke-width="8"
          stroke-linecap="round" marker-end="url(#arrow-dark)"/>
    <g filter="url(#soft-shadow)">
      <rect x="230" y="1184" width="610" height="83" rx="41"
            fill="#172033"/>
      <circle cx="282" cy="1225" r="23" fill="#ffffff"/>
      <path d="M271 1225l8 9 15-19"
            fill="none" stroke="#172033" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="321" y="1218" class="stage" fill="#cbd2dc">4 · 반영</text>
      <text x="321" y="1252" class="result-title" fill="#ffffff">
        채택할 변경만 commit · push · PR
      </text>
    </g>

    <path d="M840 1225h17" stroke="#8b93a0" stroke-width="4"
          stroke-dasharray="9 10" stroke-linecap="round"/>
    <rect x="857" y="1187" width="157" height="76" rx="22"
          fill="#e4e0d8" stroke="#b8b2a7" stroke-width="2"/>
    <text x="935" y="1218" class="small" text-anchor="middle">나머지는</text>
    <text x="935" y="1248" class="small" text-anchor="middle">archive · 삭제</text>

    <!-- Caveat -->
    <g>
      <rect x="72" y="1292" width="936" height="42" rx="18"
            fill="#ece5d9"/>
      <rect x="72" y="1292" width="106" height="42" rx="18"
            fill="#b06b32"/>
      <text x="125" y="1321" class="caveat-title" fill="#ffffff"
            text-anchor="middle">주의</text>
      <text x="197" y="1321" class="caveat">
        worktree는 병합 충돌과 포트·DB 같은 외부 상태까지 격리하지 않습니다.
      </text>
    </g>
  </svg>
</body>
</html>
