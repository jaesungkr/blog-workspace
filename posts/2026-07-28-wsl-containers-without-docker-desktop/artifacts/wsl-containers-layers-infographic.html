<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WSL 컨테이너의 네 층</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1350px;
      margin: 0;
      overflow: hidden;
    }
    body {
      color: #172027;
      background: #f5f1e9;
      font-family: "Apple SD Gothic Neo", "AppleGothic", sans-serif;
    }
    svg { display: block; width: 1080px; height: 1350px; }
    .eyebrow { font-size: 36px; font-weight: 800; letter-spacing: 0.07em; }
    .headline { font-size: 68px; font-weight: 850; letter-spacing: -0.055em; }
    .subtitle { font-size: 40px; font-weight: 650; letter-spacing: -0.028em; }
    .primary { font-size: 52px; font-weight: 850; letter-spacing: -0.045em; }
    .primary-small { font-size: 48px; font-weight: 850; letter-spacing: -0.04em; }
    .support { font-size: 40px; font-weight: 680; letter-spacing: -0.025em; }
    .support-small { font-size: 36px; font-weight: 680; letter-spacing: -0.02em; }
    .code { font-size: 40px; font-weight: 780; letter-spacing: -0.018em; }
    .caveat { font-size: 36px; font-weight: 720; letter-spacing: -0.02em; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1080 1350" role="img"
       aria-labelledby="infographic-title infographic-desc">
    <title id="infographic-title">WSL 컨테이너가 실행되는 네 층</title>
    <desc id="infographic-desc">
      Windows 안의 WSL 2와 Ubuntu, Docker Engine, Linux 컨테이너가 네 층으로
      이어지고 Windows 브라우저는 localhost 8080을 통해 컨테이너 80번 포트에
      접속한다. 이 구성은 Linux 컨테이너용이다.
    </desc>

    <defs>
      <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fbf9f5"/>
        <stop offset="100%" stop-color="#eee8de"/>
      </linearGradient>
      <linearGradient id="linux-field" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f2d8c1"/>
        <stop offset="100%" stop-color="#e6ba91"/>
      </linearGradient>
      <linearGradient id="engine" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#39454d"/>
        <stop offset="100%" stop-color="#253038"/>
      </linearGradient>
      <linearGradient id="container" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#41769c"/>
        <stop offset="100%" stop-color="#285574"/>
      </linearGradient>
      <pattern id="grain" width="30" height="30" patternUnits="userSpaceOnUse">
        <circle cx="5" cy="7" r="0.8" fill="#33404a" opacity="0.05"/>
        <circle cx="23" cy="18" r="0.7" fill="#33404a" opacity="0.04"/>
      </pattern>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
        <feDropShadow dx="0" dy="9" stdDeviation="12"
                      flood-color="#26323a" flood-opacity="0.13"/>
      </filter>
      <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%">
        <feDropShadow dx="0" dy="5" stdDeviation="7"
                      flood-color="#26323a" flood-opacity="0.1"/>
      </filter>
      <marker id="arrow-request" markerUnits="userSpaceOnUse"
              markerWidth="24" markerHeight="24" viewBox="0 0 10 10"
              refX="9" refY="5" orient="auto">
        <path d="M0 0L10 5L0 10Z" fill="#b75d34"/>
      </marker>
      <marker id="arrow-build" markerUnits="userSpaceOnUse"
              markerWidth="22" markerHeight="22" viewBox="0 0 10 10"
              refX="9" refY="5" orient="auto">
        <path d="M0 0L10 5L0 10Z" fill="#6b8fa4"/>
      </marker>
    </defs>

    <rect width="1080" height="1350" fill="url(#background)"/>
    <rect width="1080" height="1350" fill="url(#grain)"/>
    <circle cx="1014" cy="85" r="225" fill="#dae6e2" opacity="0.5"/>
    <circle cx="60" cy="1060" r="240" fill="#f0d7c2" opacity="0.28"/>

    <!-- Header: 230px / 17.0% -->
    <g transform="translate(64 42)">
      <rect width="594" height="58" rx="29" fill="#263139"/>
      <circle cx="32" cy="29" r="9" fill="#cf7444"/>
      <circle cx="57" cy="29" r="9" fill="#6d95aa"/>
      <text x="88" y="41" class="eyebrow" fill="#ffffff">
        WSL 2 · DOCKER ENGINE
      </text>
    </g>
    <text x="64" y="174" class="headline" fill="#172027">
      WSL 컨테이너의 네 층
    </text>
    <text x="66" y="226" class="subtitle" fill="#59666d">
      Docker Desktop 없이 Ubuntu 안에서 직접 실행
    </text>

    <!-- 1. Windows boundary -->
    <g filter="url(#shadow)">
      <path d="M52 330Q52 282 100 282H980Q1028 282 1028 330V1084
               Q1028 1124 988 1124H92Q52 1124 52 1084Z"
            fill="#faf8f4" stroke="#aab6be" stroke-width="4"/>
    </g>
    <g transform="translate(84 314)">
      <rect width="276" height="68" rx="34" fill="#263139"/>
      <text x="138" y="48" class="primary-small" fill="#ffffff"
            text-anchor="middle">1 · WINDOWS</text>
    </g>

    <!-- Windows browser stays outside the Linux boundary -->
    <g filter="url(#soft-shadow)">
      <rect x="600" y="310" width="386" height="144" rx="30"
            fill="#ffffff" stroke="#aab6be" stroke-width="3"/>
      <rect x="622" y="336" width="80" height="88" rx="14"
            fill="#edf1f3" stroke="#66747d" stroke-width="4"/>
      <path d="M622 362H702" stroke="#66747d" stroke-width="4"/>
      <circle cx="638" cy="349" r="6" fill="#cf7444"/>
      <circle cx="658" cy="349" r="6" fill="#6d95aa"/>
      <path d="M642 386h40M642 405h27" stroke="#73848d"
            stroke-width="6" stroke-linecap="round"/>
      <text x="850" y="368" class="primary-small" fill="#172027"
            text-anchor="middle">브라우저</text>
      <text x="850" y="414" class="support-small" fill="#8a4225"
            text-anchor="middle">localhost:8080</text>
    </g>

    <!-- 2. WSL 2 + Ubuntu boundary -->
    <path d="M112 520Q112 474 158 474H922Q968 474 968 520V1042
             Q968 1080 930 1080H150Q112 1080 112 1042Z"
          fill="url(#linux-field)" stroke="#bf7148" stroke-width="4"/>
    <g transform="translate(148 506)">
      <rect width="540" height="76" rx="38" fill="#b65f37"/>
      <text x="270" y="54" class="primary" fill="#ffffff"
            text-anchor="middle">2 · WSL 2 + UBUNTU</text>
    </g>
    <text x="156" y="628" class="support" fill="#7c482f">
      Linux 커널 · systemd
    </text>

    <!-- 3. Docker Engine -->
    <g filter="url(#soft-shadow)">
      <rect x="216" y="682" width="548" height="202" rx="40"
            fill="url(#engine)" stroke="#111a20" stroke-width="3"/>
      <text x="490" y="758" class="primary" fill="#ffffff"
            text-anchor="middle">3 · Docker Engine</text>
      <text x="490" y="818" class="support" fill="#ced7dc"
            text-anchor="middle">dockerd가 실행·관리</text>
      <circle cx="286" cy="851" r="14" fill="#f0b080"/>
      <circle cx="694" cy="851" r="14" fill="#7fa798"/>
      <path d="M312 851H668" stroke="#71848e" stroke-width="9"
            stroke-linecap="round"/>
    </g>

    <!-- Engine creates and manages the container -->
    <path d="M490 884V920" fill="none" stroke="#6b8fa4" stroke-width="8"
          stroke-linecap="round" marker-end="url(#arrow-build)"/>

    <!-- 4. Linux container -->
    <g filter="url(#soft-shadow)">
      <rect x="292" y="936" width="396" height="116" rx="14"
            fill="url(#container)" stroke="#17384f" stroke-width="4"/>
      <path d="M330 950V1038M368 950V1038M406 950V1038M444 950V1038
               M482 950V1038M520 950V1038M558 950V1038M596 950V1038
               M634 950V1038"
            stroke="#8baabd" stroke-width="4" opacity="0.55"/>
      <rect x="332" y="961" width="316" height="68" rx="34"
            fill="#2b5877" opacity="0.98"/>
      <text x="490" y="1010" class="primary-small" fill="#ffffff"
            text-anchor="middle">4 · Linux 컨테이너</text>
    </g>

    <!-- Browser request path -->
    <path d="M842 454V710Q842 734 818 734H802V966
             Q802 994 774 994H712"
          fill="none" stroke="#b75d34" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"
          marker-end="url(#arrow-request)"/>
    <g transform="translate(772 760)">
      <rect width="184" height="68" rx="34" fill="#f6e5da"/>
      <text x="92" y="47" class="support-small" fill="#8a4225"
            text-anchor="middle">8080 → 80</text>
    </g>

    <!-- Scope -->
    <g transform="translate(64 1170)">
      <rect width="10" height="116" rx="5" fill="#b65f37"/>
      <text x="38" y="48" class="primary-small" fill="#172027">
        Linux 컨테이너용 구성
      </text>
      <text x="38" y="101" class="caveat" fill="#59666d">
        Windows 컨테이너 · GUI는 별도
      </text>
    </g>
  </svg>
</body>
</html>
