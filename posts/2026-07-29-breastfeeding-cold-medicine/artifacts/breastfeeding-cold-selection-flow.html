<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수유 중 감기약 성분 선택 흐름</title>
  <style>
    html, body {
      width: 1080px;
      height: 1350px;
      margin: 0;
      overflow: hidden;
      background: #f4f0e7;
    }
    svg {
      display: block;
      width: 1080px;
      height: 1350px;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      text-rendering: geometricPrecision;
    }
    .headline { font-size: 60px; font-weight: 750; letter-spacing: -2.4px; fill: #1d302d; }
    .subhead { font-size: 38px; font-weight: 500; letter-spacing: -1px; fill: #5f6d67; }
    .primary { font-size: 46px; font-weight: 750; letter-spacing: -1.7px; fill: #1d302d; }
    .support { font-size: 38px; font-weight: 520; letter-spacing: -1.1px; fill: #52615c; }
    .object-label { font-size: 34px; font-weight: 700; letter-spacing: -0.8px; }
    .micro { font-size: 30px; font-weight: 650; letter-spacing: -0.7px; }
    .caveat { font-size: 34px; font-weight: 650; letter-spacing: -0.8px; }
    .step { font-size: 32px; font-weight: 800; fill: #fffdf7; }
  </style>
</head>
<body>
<svg viewBox="0 0 1080 1350" role="img" aria-label="종합감기약의 유효성분을 나누고, 지금 필요한 증상 성분만 남긴 뒤, 아기 상태와 모유량을 함께 확인하는 세 단계 흐름">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f8f5ed"/>
      <stop offset="1" stop-color="#eee8dc"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#50796e"/>
      <stop offset="1" stop-color="#31584f"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#324941" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="9.5" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#497268"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="9.5" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#a7aaa2"/>
    </marker>
  </defs>

  <rect width="1080" height="1350" fill="url(#paper)"/>
  <circle cx="972" cy="68" r="170" fill="#dfe9e2" opacity="0.72"/>
  <circle cx="106" cy="1160" r="220" fill="#e7ddca" opacity="0.56"/>

  <text class="headline" x="72" y="92">수유 중 감기약,</text>
  <text class="headline" x="72" y="162">제품명보다 성분부터</text>
  <text class="subhead" x="72" y="215">필요한 성분만 남기는 세 단계 선택 흐름</text>
  <path d="M72 245 H1008" stroke="#c5c9c0" stroke-width="2"/>

  <circle cx="103" cy="315" r="31" fill="#31584f"/>
  <text class="step" x="103" y="326" text-anchor="middle">1</text>
  <text class="primary" x="160" y="312">약 상자에서 유효성분을 나눕니다</text>
  <text class="support" x="160" y="358">한 제품 안에도 여러 성분이 함께 들어갈 수 있습니다</text>

  <g transform="translate(110 400)" filter="url(#softShadow)">
    <path d="M0 25 L52 0 H278 L226 25 Z" fill="#dce7df"/>
    <rect x="0" y="25" width="226" height="116" rx="10" fill="#faf7ef" stroke="#31584f" stroke-width="4"/>
    <path d="M226 25 L278 0 V112 L226 141 Z" fill="#c6d7ce" stroke="#31584f" stroke-width="4"/>
    <path d="M42 72 H184" stroke="#c4b28e" stroke-width="12" stroke-linecap="round"/>
    <text class="object-label" x="113" y="124" text-anchor="middle" fill="#31584f">종합감기약</text>
  </g>

  <path d="M398 468 C450 468 451 421 500 421" fill="none" stroke="#497268" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M398 472 C480 472 492 480 597 480" fill="none" stroke="#497268" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M398 476 C450 476 451 539 500 539" fill="none" stroke="#497268" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <circle cx="584" cy="421" r="64" fill="#d58269"/>
    <circle cx="680" cy="480" r="64" fill="#69928a"/>
    <circle cx="584" cy="539" r="64" fill="#d2ae66"/>
  </g>
  <text class="object-label" x="584" y="432" text-anchor="middle" fill="#fffdf7">해열</text>
  <text class="object-label" x="680" y="491" text-anchor="middle" fill="#fffdf7">콧물</text>
  <text class="object-label" x="584" y="550" text-anchor="middle" fill="#fffdf7">카페인</text>
  <text class="micro" x="790" y="452" fill="#6d786f">제품명 하나를</text>
  <text class="micro" x="790" y="492" fill="#6d786f">성분 단위로</text>
  <text class="micro" x="790" y="532" fill="#31584f">펼쳐 봅니다</text>

  <path d="M540 602 V634" stroke="#497268" stroke-width="5" marker-end="url(#arrow)"/>

  <circle cx="103" cy="684" r="31" fill="#31584f"/>
  <text class="step" x="103" y="695" text-anchor="middle">2</text>
  <text class="primary" x="160" y="681">지금 불편한 증상 하나를 고릅니다</text>
  <text class="support" x="160" y="727">없는 증상을 위한 성분은 덜어 냅니다</text>

  <g transform="translate(112 772)">
    <circle cx="68" cy="0" r="48" fill="#f0d8d0" stroke="#d58269" stroke-width="4"/>
    <path d="M47 -7 H89 M54 10 H82" stroke="#b76552" stroke-width="8" stroke-linecap="round"/>
    <text class="micro" x="68" y="83" text-anchor="middle" fill="#6a514b">열·몸살</text>

    <circle cx="302" cy="0" r="48" fill="#dce9e6" stroke="#69928a" stroke-width="4"/>
    <path d="M286 -9 Q302 -25 318 -9 Q302 5 286 -9 M288 14 H316" fill="none" stroke="#426d64" stroke-width="7" stroke-linecap="round"/>
    <text class="micro" x="302" y="83" text-anchor="middle" fill="#47625d">콧물</text>

    <circle cx="536" cy="0" r="48" fill="#e6dfd2" stroke="#ad9a77" stroke-width="4"/>
    <path d="M517 -8 Q536 -30 555 -8 M520 14 Q536 -2 552 14" fill="none" stroke="#7e6c50" stroke-width="7" stroke-linecap="round"/>
    <text class="micro" x="536" y="83" text-anchor="middle" fill="#665c4b">코막힘</text>

    <circle cx="770" cy="0" r="48" fill="#e8dfeb" stroke="#937c9d" stroke-width="4"/>
    <path d="M746 -10 Q770 -24 794 -10 M751 11 Q770 23 789 11" fill="none" stroke="#745f7e" stroke-width="7" stroke-linecap="round"/>
    <text class="micro" x="770" y="83" text-anchor="middle" fill="#62566a">기침</text>
  </g>

  <path d="M180 875 C260 900 345 906 438 906" fill="none" stroke="#a7aaa2" stroke-width="4" marker-end="url(#arrowMuted)"/>
  <path d="M414 875 C442 889 462 897 488 902" fill="none" stroke="#a7aaa2" stroke-width="4" marker-end="url(#arrowMuted)"/>
  <path d="M648 875 C617 889 600 897 572 902" fill="none" stroke="#497268" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M882 875 C804 900 716 906 622 906" fill="none" stroke="#a7aaa2" stroke-width="4" marker-end="url(#arrowMuted)"/>
  <path d="M438 902 L480 962 H600 L622 902 Z" fill="#dfe8e2" stroke="#497268" stroke-width="5"/>
  <circle cx="540" cy="952" r="42" fill="url(#sage)" filter="url(#softShadow)"/>
  <text class="micro" x="540" y="963" text-anchor="middle" fill="#fffdf7">필요</text>

  <circle cx="103" cy="1069" r="31" fill="#31584f"/>
  <text class="step" x="103" y="1080" text-anchor="middle">3</text>
  <text class="primary" x="160" y="1066">아기와 모유량 조건을 함께 봅니다</text>
  <text class="support" x="160" y="1112">생후 주수 · 건강 상태 · 최근 모유량</text>

  <path d="M540 1125 V1138 M280 1138 H838 M280 1138 V1150 M540 1138 V1150 M838 1138 V1150" fill="none" stroke="#8ea19a" stroke-width="4"/>

  <g transform="translate(202 1148)">
    <path d="M0 40 Q78 80 156 40" fill="#dce9e6" stroke="#497268" stroke-width="5"/>
    <path d="M9 40 H147" stroke="#497268" stroke-width="5"/>
    <circle cx="78" cy="24" r="20" fill="#e7c7ae"/>
    <path d="M56 26 Q78 3 100 26" fill="#efe4d4"/>
    <path d="M27 67 H129" stroke="#497268" stroke-width="5" stroke-linecap="round"/>
    <text class="micro" x="78" y="118" text-anchor="middle" fill="#31584f">아기 상태</text>
  </g>

  <g transform="translate(470 1148)">
    <path d="M70 0 C59 20 42 36 42 57 C42 78 54 92 70 92 C86 92 98 78 98 57 C98 36 81 20 70 0 Z" fill="#c6dedb" stroke="#497268" stroke-width="5"/>
    <path d="M55 62 Q70 74 85 62" fill="none" stroke="#497268" stroke-width="6" stroke-linecap="round"/>
    <text class="micro" x="70" y="118" text-anchor="middle" fill="#31584f">최근 모유량</text>
  </g>

  <g transform="translate(752 1158)">
    <rect x="0" y="0" width="172" height="72" rx="36" fill="#fffdf7" stroke="#d58269" stroke-width="5"/>
    <path d="M86 3 V69" stroke="#d58269" stroke-width="5"/>
    <path d="M24 36 H65 M107 36 H148" stroke="#d58269" stroke-width="7" stroke-linecap="round"/>
    <text class="micro" x="86" y="108" text-anchor="middle" fill="#7b5147">필요 성분</text>
  </g>

  <rect x="0" y="1285" width="1080" height="65" fill="#8c5148"/>
  <circle cx="74" cy="1318" r="20" fill="#fff3e7"/>
  <text class="caveat" x="74" y="1330" text-anchor="middle" fill="#8c5148">!</text>
  <text class="caveat" x="116" y="1330" fill="#fffdf7">슈도에페드린·메틸에페드린·복합감기약은 먼저 상담</text>
</svg>
</body>
</html>
