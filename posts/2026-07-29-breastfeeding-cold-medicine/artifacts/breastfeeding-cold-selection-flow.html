<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수유 중 감기약 세 칸 분류</title>
  <style>
    html, body {
      width: 1080px;
      height: 1350px;
      margin: 0;
      overflow: hidden;
      background: #f4f0e7;
    }
    svg {
      display: block;
      width: 1080px;
      height: 1350px;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      text-rendering: geometricPrecision;
    }
    .headline { font-size: 60px; font-weight: 750; letter-spacing: -2.3px; fill: #19312d; }
    .subhead { font-size: 36px; font-weight: 520; letter-spacing: -1px; fill: #5d6964; }
    .primary { font-size: 46px; font-weight: 760; letter-spacing: -1.6px; }
    .support { font-size: 36px; font-weight: 560; letter-spacing: -1px; }
    .caveat { font-size: 34px; font-weight: 650; letter-spacing: -0.9px; }
    .symbol { font-size: 48px; font-weight: 800; }
  </style>
</head>
<body>
<svg viewBox="0 0 1080 1350" role="img" aria-label="집에 있는 감기약을 바로 복용 검토, 약사에게 먼저 확인, 집에서 복용하지 않기의 세 행동으로 나누는 흐름">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf7ef"/>
      <stop offset="1" stop-color="#eee8dc"/>
    </linearGradient>
    <linearGradient id="greenWash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#deebe4"/>
      <stop offset="1" stop-color="#f4f0e7" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="amberWash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0e2bf"/>
      <stop offset="1" stop-color="#f4f0e7" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="redWash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efd9d2"/>
      <stop offset="1" stop-color="#f4f0e7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#31483f" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#paper)"/>
  <circle cx="1008" cy="58" r="184" fill="#dce7df" opacity="0.72"/>
  <circle cx="34" cy="1282" r="180" fill="#eadfcd" opacity="0.7"/>

  <text class="headline" x="68" y="88">집에 있는 감기약,</text>
  <text class="headline" x="68" y="158">세 칸으로 나누기</text>
  <text class="subhead" x="68" y="212">성분과 제품 허가사항을 보고 다음 행동을 고릅니다</text>
  <path d="M68 242 H1012" stroke="#c7c9c1" stroke-width="2"/>

  <!-- One medicine package enters a three-way sorting rail. -->
  <g transform="translate(62 555)" filter="url(#softShadow)">
    <path d="M0 24 L42 0 H194 L152 24 Z" fill="#d9e5dd"/>
    <rect x="0" y="24" width="152" height="106" fill="#fffdf7" stroke="#315b51" stroke-width="4"/>
    <path d="M152 24 L194 0 V101 L152 130 Z" fill="#c5d8ce" stroke="#315b51" stroke-width="4"/>
    <path d="M34 64 H118" stroke="#c8ae7d" stroke-width="11" stroke-linecap="round"/>
    <path d="M34 91 H96" stroke="#7a978f" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text class="caveat" x="159" y="730" text-anchor="middle" fill="#315b51">집에 있는 약</text>
  <text class="caveat" x="159" y="773" text-anchor="middle" fill="#6a746f">성분·허가사항</text>

  <path d="M256 625 H315 M315 380 V880" fill="none" stroke="#80958d" stroke-width="5"/>
  <path d="M315 380 H376 M315 630 H376 M315 880 H376" fill="none" stroke="#80958d" stroke-width="5"/>
  <circle cx="315" cy="380" r="11" fill="#4f7e6d"/>
  <circle cx="315" cy="630" r="11" fill="#b2822e"/>
  <circle cx="315" cy="880" r="11" fill="#a9594d"/>

  <!-- Green lane: an open gate and check mark. -->
  <path d="M376 265 H1010 V500 H418 L376 458 Z" fill="url(#greenWash)"/>
  <g transform="translate(904 322)">
    <path d="M0 12 V103 M74 12 V103" stroke="#315b51" stroke-width="11" stroke-linecap="round"/>
    <circle cx="37" cy="58" r="46" fill="#f8f5ed" stroke="#4f7e6d" stroke-width="7"/>
    <path d="M15 59 L31 75 L62 39" fill="none" stroke="#4f7e6d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="primary" x="408" y="315" fill="#274f45">바로 복용 검토</text>
  <text class="support" x="408" y="405" fill="#365b51">아세트아미노펜</text>
  <text class="support" x="408" y="449" fill="#365b51">이부프로펜 단일제 등</text>

  <!-- Amber lane: the medicine stops at a magnifying checkpoint. -->
  <path d="M376 515 H1010 V750 H418 L376 708 Z" fill="url(#amberWash)"/>
  <g transform="translate(900 572)">
    <rect x="0" y="36" width="72" height="42" rx="21" fill="#f7f0df" stroke="#9b6d21" stroke-width="6"/>
    <path d="M36 39 V75" stroke="#9b6d21" stroke-width="5"/>
    <circle cx="78" cy="26" r="30" fill="#fffdf7" stroke="#9b6d21" stroke-width="7"/>
    <path d="M99 47 L126 75" stroke="#9b6d21" stroke-width="9" stroke-linecap="round"/>
  </g>
  <text class="primary" x="408" y="565" fill="#805b1d">약사에게 먼저 확인</text>
  <text class="support" x="408" y="655" fill="#745923">판피린티정</text>
  <text class="support" x="408" y="699" fill="#745923">먹는 코막힘약·복합감기약 등</text>

  <!-- Red lane: a physical stop bar blocks the medicine. -->
  <path d="M376 765 H1010 V1018 H418 L376 976 Z" fill="url(#redWash)"/>
  <g transform="translate(895 820)">
    <rect x="0" y="39" width="76" height="42" rx="21" fill="#f9ece8" stroke="#98493e" stroke-width="6"/>
    <path d="M38 42 V78" stroke="#98493e" stroke-width="5"/>
    <circle cx="91" cy="60" r="52" fill="#fffdf7" stroke="#98493e" stroke-width="8"/>
    <path d="M58 60 H124" stroke="#98493e" stroke-width="12" stroke-linecap="round"/>
  </g>
  <text class="primary" x="408" y="815" fill="#8e453b">집에서 복용하지 않기</text>
  <text class="support" x="408" y="895" fill="#7d4b44">액티피드정(허가사항)</text>
  <text class="support" x="408" y="939" fill="#7d4b44">코데인·트라마돌</text>
  <text class="support" x="408" y="983" fill="#7d4b44">고용량·반복 아스피린</text>

  <!-- Conditional transfer from green to amber. -->
  <path d="M90 1060 H990" stroke="#c3b797" stroke-width="3"/>
  <text class="primary" x="90" y="1120" fill="#315b51">초록칸도 이때는 노랑칸으로</text>
  <g transform="translate(92 1160)">
    <circle cx="24" cy="24" r="24" fill="#315b51"/>
    <text class="symbol" x="24" y="41" text-anchor="middle" fill="#fffdf7">!</text>
    <text class="caveat" x="66" y="36" fill="#40564f">신생아·미숙아·질환아</text>
  </g>
  <g transform="translate(92 1223)">
    <path d="M24 0 C12 20 4 31 4 44 C4 59 12 68 24 68 C36 68 44 59 44 44 C44 31 36 20 24 0 Z" fill="#79a19a"/>
    <text class="caveat" x="66" y="48" fill="#40564f">모유량이 아직 적거나 불안정함</text>
  </g>
  <g transform="translate(585 1160)">
    <rect x="0" y="4" width="54" height="40" rx="20" fill="#fffdf7" stroke="#a16b5e" stroke-width="5"/>
    <path d="M27 7 V41" stroke="#a16b5e" stroke-width="4"/>
    <text class="caveat" x="72" y="36" fill="#40564f">중복 성분·산모 금기</text>
  </g>
  <path d="M665 1261 C735 1261 776 1261 827 1261" fill="none" stroke="#b2822e" stroke-width="6"/>
  <path d="M817 1245 L839 1261 L817 1277" fill="none" stroke="#b2822e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="846" y="1224" width="164" height="74" rx="37" fill="#b2822e"/>
  <text class="caveat" x="928" y="1273" text-anchor="middle" fill="#fffdf7">먼저 확인</text>

  <rect x="0" y="1305" width="1080" height="45" fill="#7e4a42"/>
  <text class="caveat" x="540" y="1338" text-anchor="middle" fill="#fffdf7">처방받은 저용량 아스피린은 임의로 끊지 않습니다</text>
</svg>
</body>
</html>
