<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>병행수입 글 렌더링 검수</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #e8ebef;
    }

    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px;
      overflow-wrap: break-word;
      color: #202124;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Noto Sans KR", sans-serif;
      font-size: 17px;
      line-height: 1.78;
      word-break: keep-all;
    }

    h2 {
      margin: 2.1em 0 0.7em;
      color: #17212b;
      font-size: 28px;
      line-height: 1.35;
    }

    p {
      margin: 1em 0;
    }

    a {
      color: #1967d2;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    strong {
      color: #111;
    }

    table {
      width: 100%;
      margin: 1.5em 0;
      border-collapse: collapse;
      font-size: 15px;
      line-height: 1.55;
    }

    th,
    td {
      padding: 10px 11px;
      border: 1px solid #c8cdd3;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f3f5f7;
    }

    .qa-slot {
      margin: 0 0 30px;
      padding: 20px 12px;
      border: 2px dashed #a7adb4;
      color: #59636e;
      background: #f7f8fa;
      font-size: 14px;
      text-align: center;
    }

    .qa-slot b {
      display: block;
      color: #303840;
      font-size: 16px;
    }

    .qa-info {
      margin: 30px 0;
    }

    .qa-error {
      color: #b3261e;
      white-space: pre-wrap;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px;
        font-size: 16px;
        line-height: 1.72;
      }

      h2 {
        font-size: 23px;
      }

      table {
        font-size: 13px;
        line-height: 1.45;
      }

      th,
      td {
        padding: 7px 6px;
      }

      .qa-slot {
        margin-bottom: 24px;
        padding: 14px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="qa-slot qa-hero">
    <b>대표 이미지</b>
    제목 바로 아래 업로드 위치
  </div>
  <main id="article" aria-live="polite">렌더링 결과를 불러오는 중입니다.</main>
  <script>
    fetch("/dist/parallel-import-counterfeit.html")
      .then((response) => {
        if (!response.ok) {
          throw new Error(`렌더링 결과를 불러오지 못했습니다: ${response.status}`);
        }
        return response.text();
      })
      .then((html) => {
        const article = document.querySelector("#article");
        article.innerHTML = html;
        const firstTable = article.querySelector("table");
        if (firstTable) {
          firstTable.insertAdjacentHTML(
            "afterend",
            '<div class="qa-slot qa-info"><b>보조 인포그래픽</b>첫 비교표 바로 아래 업로드 위치</div>',
          );
        }
      })
      .catch((error) => {
        document.querySelector("#article").innerHTML =
          `<p class="qa-error">${error.message}</p>`;
      });
  </script>
</body>
</html>
