<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>경기도 재정의 양쪽 압력</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1350px;
      margin: 0;
      overflow: hidden;
      background: #f3f0e9;
    }
    body {
      font-family: "Apple SD Gothic Neo", "AppleGothic", "Noto Sans KR", sans-serif;
      color: #1f2b30;
    }
    svg { display: block; width: 1080px; height: 1350px; }
    .eyebrow { font-size: 28px; font-weight: 760; letter-spacing: 0.08em; }
    .headline { font-size: 60px; font-weight: 850; letter-spacing: -0.055em; }
    .primary { font-size: 48px; font-weight: 850; letter-spacing: -0.045em; }
    .support { font-size: 38px; font-weight: 670; letter-spacing: -0.035em; }
    .caveat { font-size: 34px; font-weight: 650; letter-spacing: -0.025em; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1080 1350" role="img" aria-labelledby="graphic-title graphic-desc">
    <title id="graphic-title">경기도 재정은 부도보다 양쪽 압력으로 이해</title>
    <desc id="graphic-desc">공식 부도 판정은 없지만 취득세와 재정자립도는 내려가고 복지예산과 상환 부담은 커지는 구조를 보여 줍니다.</desc>

    <defs>
      <pattern id="grain" width="38" height="38" patternUnits="userSpaceOnUse">
        <circle cx="7" cy="9" r="0.9" fill="#32464c" opacity="0.045"/>
        <circle cx="29" cy="26" r="0.7" fill="#32464c" opacity="0.032"/>
      </pattern>
      <linearGradient id="left-field" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#dfe9e4"/>
        <stop offset="1" stop-color="#cdded8"/>
      </linearGradient>
      <linearGradient id="right-field" x1="1" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ead8ce"/>
        <stop offset="1" stop-color="#e3c9bb"/>
      </linearGradient>
      <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%">
        <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#25363c" flood-opacity="0.13"/>
      </filter>
      <marker id="left-arrow" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
        <path d="M0 0L10 5L0 10Z" fill="#2e665e"/>
      </marker>
      <marker id="right-arrow" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
        <path d="M0 0L10 5L0 10Z" fill="#a5583e"/>
      </marker>
    </defs>

    <rect width="1080" height="1350" fill="#f3f0e9"/>
    <circle cx="1030" cy="74" r="210" fill="#dfe9e4" opacity="0.8"/>
    <circle cx="20" cy="1292" r="220" fill="#ead8ce" opacity="0.7"/>
    <rect width="1080" height="1350" fill="url(#grain)"/>

    <!-- Header: 232px, 17.2% -->
    <g transform="translate(72 46)">
      <path d="M0 14H42" stroke="#b88032" stroke-width="8" stroke-linecap="round"/>
      <text x="62" y="25" class="eyebrow" fill="#56666b">경기도 재정 팩트체크</text>
    </g>
    <text x="72" y="142" class="headline" fill="#1f2b30">부도보다 먼저 볼 것은</text>
    <text x="72" y="210" class="headline" fill="#1f2b30">세입과 지출의 양쪽 압력</text>
    <path d="M72 244H1008" stroke="#c4c7c1" stroke-width="2"/>

    <!-- Verdict strip -->
    <g transform="translate(72 286)" filter="url(#soft-shadow)">
      <path d="M0 0H936V128H0Z" fill="#243d45"/>
      <path d="M0 0H15V128H0Z" fill="#d1a14c"/>
      <text x="48" y="52" class="support" fill="#d6e0e2">2026년 8월 9일 공개 자료 기준</text>
      <text x="48" y="104" class="primary" fill="#ffffff">공식 부도 판정 없음 · 재정 경고는 분명</text>
    </g>

    <!-- Two pressure fields -->
    <path d="M72 470H486L524 575L486 680H72Z" fill="url(#left-field)"/>
    <path d="M1008 470H594L556 575L594 680H1008Z" fill="url(#right-field)"/>

    <g transform="translate(112 512)">
      <text x="0" y="0" class="support" fill="#476b65">들어오는 돈</text>
      <text x="0" y="70" class="primary" fill="#235c54">취득세 11조 → 8.1조</text>
      <text x="0" y="122" class="support" fill="#2e665e">2022→2026 · 약 26% 감소</text>
    </g>
    <path d="M438 575H520" stroke="#2e665e" stroke-width="8" stroke-linecap="round" marker-end="url(#left-arrow)"/>

    <g transform="translate(630 512)">
      <text x="0" y="0" class="support" fill="#8c5a49">써야 할 돈</text>
      <text x="0" y="70" class="primary" fill="#95492f">복지예산 14조 → 19.6조</text>
      <text x="0" y="122" class="support" fill="#a5583e">2022→2026 · 40% 증가</text>
    </g>
    <path d="M642 575H560" stroke="#a5583e" stroke-width="8" stroke-linecap="round" marker-end="url(#right-arrow)"/>

    <!-- Squeezed fiscal room -->
    <g transform="translate(72 746)">
      <path d="M0 74C188 20 290 10 420 54C474 72 496 72 516 54C646 -8 764 14 936 74V286C760 332 642 354 516 294C490 282 468 282 420 294C286 340 178 324 0 286Z" fill="#e8e3d8" stroke="#aaa89f" stroke-width="3"/>
      <text x="468" y="128" text-anchor="middle" class="support" fill="#667176">재정 여력</text>
      <text x="468" y="198" text-anchor="middle" class="primary" fill="#293e45">55.7% → 44.4%</text>
      <text x="468" y="250" text-anchor="middle" class="support" fill="#59696e">재정자립도 -11.3%p</text>
      <path d="M86 70C216 40 322 48 402 78" fill="none" stroke="#2e665e" stroke-width="7" stroke-linecap="round"/>
      <path d="M850 70C722 40 616 48 536 78" fill="none" stroke="#a5583e" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- Reading rule -->
    <g transform="translate(112 1122)">
      <circle cx="36" cy="36" r="36" fill="#d1a14c"/>
      <path d="M19 36L31 48L54 23" fill="none" stroke="#243d45" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="98" y="27" class="primary" fill="#243d45">한 가지 원인으로 단정하지 않기</text>
      <text x="98" y="79" class="support" fill="#56666b">세입 감소 · 지출 수요 · 상환 계획을 함께 확인</text>
    </g>

    <path d="M72 1260H1008" stroke="#c4c7c1" stroke-width="2"/>
    <text x="72" y="1310" class="caveat" fill="#5c676a">경기도 공식 설명·2026 예산 기준 · 결산과 회계 범위에 따라 달라질 수 있음</text>
  </svg>
</body>
</html>
