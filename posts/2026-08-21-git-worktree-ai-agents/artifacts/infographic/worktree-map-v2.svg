<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">한 저장소, 세 작업 폴더</title>
  <desc id="desc">하나의 Git 저장소가 commit과 refs를 공유하면서 main, Claude, Codex 작업 폴더에는 각각 HEAD, index, 파일을 따로 두는 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f3"/>
      <stop offset="1" stop-color="#f1ede6"/>
    </linearGradient>
    <linearGradient id="repo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343238"/>
      <stop offset="1" stop-color="#1e1d21"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#261f1b" flood-opacity="0.16"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#261f1b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <path d="M0 170 H1080" stroke="#ded7ce" stroke-width="2"/>
  <text x="70" y="103" fill="#222126" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="62" font-weight="760" letter-spacing="-2">한 저장소, 세 작업 폴더</text>
  <text x="72" y="145" fill="#706a64" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="33" font-weight="550">공유할 것과 분리할 것을 나눕니다</text>

  <!-- Shared Git repository -->
  <g filter="url(#shadow)">
    <ellipse cx="540" cy="862" rx="170" ry="52" fill="#48454b"/>
    <rect x="370" y="804" width="340" height="58" fill="url(#repo)"/>
    <ellipse cx="540" cy="804" rx="170" ry="52" fill="#57535a"/>
    <ellipse cx="540" cy="804" rx="124" ry="31" fill="#262429"/>
    <circle cx="540" cy="804" r="12" fill="#ef583d"/>
  </g>
  <text x="540" y="950" text-anchor="middle" fill="#222126" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="46" font-weight="760">Git 저장소</text>
  <text x="540" y="996" text-anchor="middle" fill="#706a64" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="36" font-weight="600">공유 · commits와 refs</text>

  <!-- Branch rails -->
  <path d="M540 780 C540 690 235 685 235 570" fill="none" stroke="#3b3940" stroke-width="18" stroke-linecap="round"/>
  <path d="M540 780 L540 570" fill="none" stroke="#3b3940" stroke-width="18" stroke-linecap="round"/>
  <path d="M540 780 C540 690 845 685 845 570" fill="none" stroke="#3b3940" stroke-width="18" stroke-linecap="round"/>
  <circle cx="540" cy="728" r="16" fill="#ef583d" stroke="#f8f4ed" stroke-width="7"/>
  <circle cx="330" cy="682" r="16" fill="#ef583d" stroke="#f8f4ed" stroke-width="7"/>
  <circle cx="750" cy="682" r="16" fill="#ef583d" stroke="#f8f4ed" stroke-width="7"/>

  <!-- Main folder -->
  <g filter="url(#soft)">
    <path d="M92 340 H212 L247 380 H378 V588 H92 Z" fill="#fffdf9" stroke="#cfc6bb" stroke-width="3"/>
    <text x="235" y="438" text-anchor="middle" fill="#5f5a55" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="36" font-weight="650">HEAD · index</text>
    <text x="235" y="486" text-anchor="middle" fill="#5f5a55" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="36" font-weight="650">작업 파일</text>
    <circle cx="235" cy="552" r="17" fill="#ef583d"/>
  </g>
  <text x="235" y="282" text-anchor="middle" fill="#222126" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="46" font-weight="760">main</text>

  <!-- Claude folder -->
  <g filter="url(#soft)">
    <path d="M397 340 H517 L552 380 H683 V588 H397 Z" fill="#f7e8d6" stroke="#d8bea2" stroke-width="3"/>
    <text x="540" y="438" text-anchor="middle" fill="#5f5a55" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="36" font-weight="650">HEAD · index</text>
    <text x="540" y="486" text-anchor="middle" fill="#5f5a55" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="36" font-weight="650">작업 파일</text>
    <circle cx="540" cy="552" r="17" fill="#ef583d"/>
  </g>
  <text x="540" y="282" text-anchor="middle" fill="#222126" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="46" font-weight="760">Claude</text>

  <!-- Codex folder -->
  <g filter="url(#soft)">
    <path d="M702 340 H822 L857 380 H988 V588 H702 Z" fill="#e7eceb" stroke="#b9c6c3" stroke-width="3"/>
    <text x="845" y="438" text-anchor="middle" fill="#5f5a55" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="36" font-weight="650">HEAD · index</text>
    <text x="845" y="486" text-anchor="middle" fill="#5f5a55" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="36" font-weight="650">작업 파일</text>
    <circle cx="845" cy="552" r="17" fill="#ef583d"/>
  </g>
  <text x="845" y="282" text-anchor="middle" fill="#222126" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="46" font-weight="760">Codex</text>

  <text x="540" y="1040" text-anchor="middle" fill="#8a4638" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="33" font-weight="650">같은 줄을 고치면 merge 충돌은 남습니다</text>
</svg>
