<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>블로그 소개 - Tistory preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f3; color: #222; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    main { width: min(760px, calc(100% - 32px)); margin: 48px auto; padding: 48px; background: #fff; }
    h1 { margin: 0 0 24px; font-size: 2rem; line-height: 1.35; }
    img { display: block; width: 100%; height: auto; margin: 0 0 32px; }
    iframe { display: block; width: 100%; height: 2550px; border: 0; }
    @media (max-width: 600px) {
      main { width: 100%; margin: 0; padding: 24px 18px; }
      h1 { font-size: 1.65rem; margin-bottom: 18px; }
      img { margin-bottom: 24px; }
      iframe { height: 3300px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>블로그 소개</h1>
    <img src="../../assets/hero.png" alt="서로 다른 다섯 갈래의 종이가 투명한 검사판을 지나 한 권의 열린 노트로 모이는 모습">
    <iframe src="../../../../dist/about-dev-log.html" title="티스토리 HTML 본문"></iframe>
  </main>
</body>
</html>
