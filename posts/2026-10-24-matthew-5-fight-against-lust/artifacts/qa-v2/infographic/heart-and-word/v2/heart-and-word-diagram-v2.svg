<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 572" role="img" aria-labelledby="heart-and-word-diagram-v2-title heart-and-word-diagram-v2-desc" id="heart-and-word-diagram-v2-root">
<title id="heart-and-word-diagram-v2-title">마음에 말씀을 두기</title>
<desc id="heart-and-word-diagram-v2-desc">죄를 숨기던 마음에서 회개하며 돌이키고 하나님을 향한 사랑과 말씀으로 마음을 채워 가라는 설교의 권면을 보여 줍니다.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #heart-and-word-diagram-v2-root { color: #2d3142; font-family: 'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
      #heart-and-word-diagram-v2-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#heart-and-word-diagram-v2-root .diagram-container { overflow-x:visible }
}</style><marker id="heart-and-word-diagram-v2-heart-word-v2-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 3 L0 6 Z" fill="#4f5d75"/></marker></defs>
<rect width="320" height="572" fill="#f5f5f5"/>
<text x="40" y="56" font-family="'Instrument Serif','Noto Serif KR',serif" font-size="28" font-weight="400" fill="#2d3142">마음에 말씀을 두기</text>
<!-- Connections and label masks precede every state node. -->
<line x1="160" y1="168" x2="160" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#heart-and-word-diagram-v2-heart-word-v2-arrow)"/>
<rect x="168" y="192" width="108" height="28" fill="#f5f5f5"/>
<line x1="160" y1="312" x2="160" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#heart-and-word-diagram-v2-heart-word-v2-arrow)"/>
<rect x="168" y="336" width="108" height="28" fill="#f5f5f5"/>
<g font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#4f5d75">
<text x="180" y="210">죄를 끊어 내기</text><text x="180" y="354">말씀을 두기</text>
</g>
<!-- State treatment: concealed desire, a turning, then one larger focal state. -->
<rect x="64" y="104" width="192" height="64" rx="8" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
<rect x="80" y="248" width="160" height="64" rx="8" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<rect x="40" y="392" width="240" height="80" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
<g font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2d3142">
<text x="160" y="142">욕망을 숨기는 마음</text>
<text x="160" y="272">회개하며</text><text x="160" y="296">돌이키는 마음</text>
<text x="160" y="424" fill="#bf4520">말씀으로 채워 가는 마음</text>
</g>
<text x="160" y="452" text-anchor="middle" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#4f5d75">하나님을 향한 사랑과 말씀</text>
</svg>
