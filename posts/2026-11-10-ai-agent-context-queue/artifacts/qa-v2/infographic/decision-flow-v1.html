<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>판단 대기와 다음 행동</title>
<style>
:root { color-scheme: light; --paper:#ffffff; --paper-2:#f5f5f7; --ink:#1d1d1f; --muted:#636366; --accent:#0066cc; --accent-tint:#edf5ff; }
html,body { margin:0; padding:0; background:#ffffff; }
body { color:#1d1d1f; font-family:'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif; }
.diagram-container { width:100%; overflow-x:auto; }
svg { display:block; width:640px; min-width:640px; height:944px; }
svg text { font-family:'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif; text-anchor:middle; fill:#1d1d1f; font-weight:600; font-size:36px; }
svg .connector { fill:none; stroke:#636366; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
svg .return { stroke-dasharray:9 7; }
svg .node { fill:#ffffff; stroke:#636366; stroke-width:2; }
svg .focal { fill:#edf5ff; stroke:#0066cc; stroke-width:3; }
svg .focal-label { fill:#0066cc; }
svg .record-label, svg .return-label { font-size:32px; }
svg .return-label { fill:#636366; font-weight:500; }
@media print { .diagram-container { overflow-x:visible; } svg { min-width:0; } }
</style></head><body><div class="diagram-container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 944" width="640" height="944" role="img" aria-labelledby="decision-flow-v1-title decision-flow-v1-desc">
<title id="decision-flow-v1-title">판단 대기와 다음 행동</title>
<desc id="decision-flow-v1-desc">AI 작업을 내 판단 대기에 모아 한 건씩 검토하고 결정과 다음 행동을 기록한 뒤 추가 작업으로 돌려보내거나 완료하는 설명용 흐름입니다.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M 1 1 L 12 7 L 1 13 Z" fill="#636366"/></marker></defs>
<rect x="0" y="0" width="640" height="944" fill="#ffffff"/>
<!-- Five states; the two routes after recording do not imply measured performance. -->
<path class="connector" d="M 360 144 V 220" marker-end="url(#arrow)"/>
<path class="connector" d="M 360 344 V 420" marker-end="url(#arrow)"/>
<path class="connector" d="M 360 528 V 604" marker-end="url(#arrow)"/>
<path class="connector" d="M 360 736 V 812" marker-end="url(#arrow)"/>
<path class="connector return" d="M 152 676 H 72 Q 64 676 64 668 V 104 Q 64 96 72 96 H 188" marker-end="url(#arrow)"/>
<rect x="80" y="544" width="156" height="56" fill="#ffffff"/>
<text class="return-label" x="158" y="582">추가 작업</text>
<rect class="node" x="200" y="48" width="320" height="96" rx="6"/>
<text x="360" y="108">AI 작업</text>
<rect class="node" x="176" y="232" width="368" height="112" rx="6" fill="#f5f5f7"/>
<text x="360" y="300">내 판단 대기</text>
<rect class="focal" x="200" y="432" width="320" height="96" rx="6"/>
<text class="focal-label" x="360" y="492">한 건 검토</text>
<rect class="node" x="152" y="616" width="416" height="120" rx="6"/>
<text class="record-label" x="360" y="687">결정·다음 행동 기록</text>
<rect class="node" x="260" y="824" width="200" height="72" rx="20"/>
<text x="360" y="872">완료</text>
</svg></div></body></html>
